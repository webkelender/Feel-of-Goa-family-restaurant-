<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feel of Goa Family Restaurant — Menu</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script type="module" src="firebase-config.js"></script>
<script nomodule>
  // Browser doesn't support ES modules at all — Firebase can never load
  window.fbModulesUnsupported = true;
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Watercolor Goa Beach Palette — exactly from image */
    --bg: #F5EDD8;           /* warm cream/sand background */
    --bg2: #EDE3C8;          /* slightly deeper sand */
    --dark: #FAEBD4;         /* light warm panel */
    --card: #FFFDF6;         /* near-white card surface */
    --card2: #FFF8EC;        /* card hover */
    --deeper: #E8DCC4;       /* deeper cream border area */
    --teal: #1A8C8C;         /* primary teal — "Feel of Goa" logo color */
    --teal-light: #2AACAC;   /* lighter teal for hover */
    --teal-dark: #126060;    /* darker teal for active */
    --price: #1A8C8C;        /* price color — teal like image */
    --brown: #5C3D1E;        /* warm dark brown for main text */
    --brown-mid: #7A5230;    /* medium brown for headings */
    --muted: #9E7A55;        /* muted warm brown for descriptions */
    --accent: #E8A850;       /* amber accent for cart/buttons */
    --accent-light: #F5C97A;
    --green: #3DA86A;
    --border: rgba(26,140,140,0.18);
    --border-warm: rgba(92,61,30,0.12);
    --shadow: rgba(92,61,30,0.15);
  }

  html, body {
    height: 100%;
    background-color: var(--bg);
    background-image: url('images/hero-1.jpg');
    background-size: cover;
    background-attachment: fixed;
    background-position: center top;
    background-repeat: no-repeat;
    color: var(--brown);
    font-family: 'Lato', 'Georgia', Georgia, serif;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, #FAEBD4 0%, #F0E4C8 100%);
    border-bottom: 2px solid rgba(26,140,140,0.2);
    padding: 12px 20px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 12px rgba(92,61,30,0.1);
  }
  .logo-label { display: none; }
  .logo-name {
    font-family: 'Dancing Script', cursive;
    font-size: 26px; font-weight: 700; color: var(--teal);
    letter-spacing: .01em; line-height: 1.1;
    text-shadow: 0 1px 3px rgba(26,140,140,0.2);
  }
  .logo-sub-text {
    font-size: 9px; font-weight: 700; color: var(--brown-mid);
    letter-spacing: .22em; text-transform: uppercase; margin-top: 1px;
  }
  .cart-btn {
    background: var(--teal); color: #fff; border: none; border-radius: 22px;
    padding: 9px 18px; cursor: pointer; font-weight: 700; font-size: 13px;
    font-family: inherit; display: flex; align-items: center; gap: 7px;
    transition: background .2s; display: none;
    box-shadow: 0 2px 8px rgba(26,140,140,0.3);
  }
  .cart-btn:hover { background: var(--teal-light); }
  .cart-btn.visible { display: flex; }

  /* ── TABS ── */
  .tabs {
    background: linear-gradient(to bottom, #F5EDD8, #EDE3C8);
    border-bottom: 2px solid rgba(26,140,140,0.15);
    display: flex; overflow-x: auto;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none; border: none; border-bottom: 2.5px solid transparent;
    color: var(--muted); padding: 12px 16px; cursor: pointer;
    font-family: 'Lato', inherit; font-size: 12.5px; white-space: nowrap; transition: all .2s;
    font-weight: 600;
  }
  .tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 700; }
  .tab-btn:hover:not(.active) { color: var(--brown); }

  /* ── HERO BANNER ── */
  .category-hero {
    position: relative; overflow: hidden; display: none;
  }
  .category-hero.visible { display: block; }
  .category-hero img { display: none; }
  .category-hero-info {
    display: flex; align-items: center; padding: 14px 18px 14px;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.5);
    border-bottom: 1px solid rgba(26,140,140,0.15);
    box-shadow: 0 2px 12px rgba(26,140,140,0.08);
  }
  .category-hero-emoji { font-size: 26px; margin-right: 10px; }
  .category-hero-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px; font-weight: 700; color: var(--teal);
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
  }
  .category-hero-count { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── MENU ITEMS ── */
  .items-grid { padding: 14px 14px 130px; max-width: 680px; margin: 0 auto; }
  .item-card {
    background: rgba(255,253,246,0.92);
    border-radius: 14px; overflow: hidden;
    border: 1.5px solid var(--border-warm);
    margin-bottom: 10px;
    transition: border-color .25s, box-shadow .25s;
    box-shadow: 0 1px 6px rgba(92,61,30,0.07);
  }
  .item-card.in-cart {
    border-color: rgba(26,140,140,0.45);
    box-shadow: 0 4px 18px rgba(26,140,140,0.13);
  }
  .item-body { padding: 12px 14px 13px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .item-info { flex: 1; }
  .item-name { font-weight: 700; font-size: 14px; color: var(--brown); margin-bottom: 3px; }
  .item-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .item-price { color: var(--teal); font-weight: 700; font-size: 15px; }
  .add-btn {
    background: transparent; color: var(--teal);
    border: 1.5px solid var(--teal); border-radius: 20px;
    padding: 5px 16px; cursor: pointer; font-weight: 700; font-size: 12px; font-family: inherit;
    transition: all .15s;
  }
  .add-btn:hover { background: var(--teal); color: #fff; }
  .qty-ctrl { display: flex; align-items: center; gap: 10px; }
  .qty-btn {
    background: transparent; border: 1.5px solid rgba(26,140,140,0.4);
    color: var(--teal); width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: all .15s; font-weight: 700;
  }
  .qty-btn:hover { background: var(--teal); color: #fff; border-color: var(--teal); }
  .qty-num { font-weight: 700; font-size: 14px; min-width: 16px; text-align: center; color: var(--brown); }

  /* ── CART DRAWER ── */
  .cart-drawer {
    position: fixed; inset: 0; z-index: 200; display: none;
    background: rgba(92,61,30,.35); backdrop-filter: blur(4px);
  }
  .cart-drawer.open { display: block; }
  .cart-panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: 100%; max-width: 420px;
    background: var(--dark); display: flex; flex-direction: column;
    border-left: 2px solid rgba(26,140,140,0.2);
    animation: slideIn .25s ease;
    box-shadow: -8px 0 32px rgba(92,61,30,0.2);
  }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .cart-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border-warm);
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    background: linear-gradient(135deg, #FAEBD4, #F0E4C8);
  }
  .cart-title { font-size: 18px; font-weight: 700; color: var(--teal); font-family: 'Playfair Display', serif; }
  .close-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 20px; padding: 4px; line-height: 1;
  }
  .close-btn:hover { color: var(--brown); }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px 20px; background: var(--card); }
  .cart-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border-warm);
  }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; color: var(--brown); }
  .cart-item-unit { font-size: 11px; color: var(--muted); }
  .cart-item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cart-item-total { color: var(--teal); font-weight: 700; font-size: 13px; min-width: 60px; text-align: right; }
  .cart-total-row {
    display: flex; justify-content: space-between; padding: 14px 20px;
    border-top: 2px solid rgba(26,140,140,0.2); font-size: 17px; font-weight: 700;
    color: var(--teal); flex-shrink: 0; background: var(--card2);
  }
  .cart-footer { padding: 14px 20px 20px; flex-shrink: 0; border-top: 1px solid var(--border-warm); background: var(--dark); }
  .field-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; display: block; font-weight: 700; }
  .field-input {
    width: 100%; background: var(--card); border: 1.5px solid rgba(26,140,140,0.2); border-radius: 9px;
    padding: 10px 13px; color: var(--brown); font-family: inherit; font-size: 13px;
    outline: none; margin-bottom: 12px; transition: border-color .2s;
  }
  .field-input:focus { border-color: var(--teal); }
  .place-btn {
    width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 11px;
    padding: 14px; cursor: pointer; font-weight: 700; font-size: 15px; font-family: inherit;
    transition: background .2s; box-shadow: 0 3px 12px rgba(26,140,140,0.3);
  }
  .place-btn:hover { background: var(--teal-light); }
  .place-btn:disabled { background: #ccc; color: #999; cursor: not-allowed; box-shadow: none; }

  /* ── SUCCESS SCREEN ── */
  #success-screen {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: var(--bg); flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
    background-image: radial-gradient(ellipse at 30% 20%, rgba(164,210,200,0.3) 0%, transparent 60%),
                      radial-gradient(ellipse at 70% 80%, rgba(164,210,200,0.2) 0%, transparent 60%);
  }
  #success-screen.show { display: flex; }
  .success-icon { font-size: 64px; margin-bottom: 20px; animation: pop .4s ease; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: var(--teal); font-family: 'Playfair Display', serif; }
  .success-sub { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .success-note { font-size: 12px; color: var(--muted); margin-bottom: 32px; }
  .order-again-btn {
    background: var(--teal); color: #fff; border: none; border-radius: 11px;
    padding: 12px 28px; cursor: pointer; font-weight: 700; font-size: 14px;
    font-family: inherit; transition: background .2s;
  }
  .order-again-btn:hover { background: var(--teal-light); }

  /* ── STICKY FOOTER ── */
  .sticky-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(135deg, #FAEBD4, #F0E4C8);
    border-top: 2px solid rgba(26,140,140,0.2); padding: 12px 16px;
    display: none; box-shadow: 0 -3px 16px rgba(92,61,30,0.12);
  }
  .sticky-footer.visible { display: block; }
  .sticky-footer-btn {
    width: 100%; max-width: 480px; margin: 0 auto; display: block;
    background: var(--teal); color: #fff; border: none; border-radius: 11px;
    padding: 14px; cursor: pointer; font-weight: 700; font-size: 14px;
    font-family: inherit; transition: background .2s;
    box-shadow: 0 3px 14px rgba(26,140,140,0.35);
  }
  .sticky-footer-btn:hover { background: var(--teal-light); }

  /* ── NOTIFICATION TOAST ── */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--teal); color: #fff; border-radius: 22px;
    padding: 10px 20px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(26,140,140,0.35);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }


  /* ── NEW CARD LAYOUT (image left, details right) ── */
  .item-card {
    background: rgba(255,253,246,0.92);
    border-radius: 14px; overflow: hidden;
    border: 1.5px solid var(--border-warm);
    margin-bottom: 10px;
    transition: border-color .25s, box-shadow .25s;
    box-shadow: 0 1px 6px rgba(92,61,30,0.07);
  }
  .item-card.in-cart {
    border-color: rgba(26,140,140,0.45);
    box-shadow: 0 4px 18px rgba(26,140,140,0.13);
  }
  .item-body {
    display: flex; align-items: stretch; gap: 0; padding: 0 !important;
    min-height: 100px;
  }
  .item-img-wrap {
    width: 100px; flex-shrink: 0;
    background: #e8e0d0;
    overflow: hidden; border-radius: 0;
    position: relative;
  }
  .item-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .item-img-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; background: rgba(26,140,140,0.07);
  }
  .item-details {
    flex: 1; padding: 12px 12px 10px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .item-name { font-weight: 700; font-size: 14px; color: var(--brown); margin-bottom: 3px; line-height: 1.3; }
  .item-desc { font-size: 11px; color: var(--muted); line-height: 1.45; margin-bottom: 8px; }
  .item-bottom { display: flex; align-items: center; justify-content: space-between; }
  .item-price { color: var(--teal); font-weight: 700; font-size: 15px; }
  .item-info { flex:1; }
  .item-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
</style>
</head>
<body>

<!-- QR-ONLY ACCESS SCREEN — shown when opened without a valid ?table= param -->
<div id="noTableScreen" style="display:none;position:fixed;inset:0;z-index:5000;background:#F5F0E8;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;">
  <div style="font-size:56px;margin-bottom:20px;">📱</div>
  <div style="font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;color:#0F6060;margin-bottom:10px;">Scan Your Table's QR Code</div>
  <div style="font-size:14px;color:#8A7060;max-width:320px;line-height:1.6;margin-bottom:6px;">
    This menu can only be opened by scanning the QR code placed on your table.
  </div>
  <div style="font-size:12px;color:#B0A090;max-width:320px;line-height:1.6;">
    If you don't see a QR code, please ask a staff member for assistance.
  </div>
</div>

<!-- MAIN PAGE CONTENT — hidden until a valid table number is confirmed -->
<div id="mainPageContent" style="display:none;">

<!-- DIAGNOSTIC BADGE — tap to see connection status, helps debug without dev tools -->
<div id="diagBadge" onclick="document.getElementById('diagPanel').style.display = document.getElementById('diagPanel').style.display === 'block' ? 'none' : 'block'"
  style="position:fixed;bottom:8px;right:8px;z-index:9999;width:14px;height:14px;border-radius:50%;background:#C8860A;box-shadow:0 0 6px rgba(0,0,0,.4);cursor:pointer;"></div>
<div id="diagPanel" style="display:none;position:fixed;bottom:30px;right:8px;z-index:9999;background:#1a1a1a;color:#eee;font-family:monospace;font-size:11px;padding:12px 14px;border-radius:10px;max-width:260px;box-shadow:0 4px 20px rgba(0,0,0,.5);line-height:1.6;"></div>

<header style="background:transparent;border-bottom:none;padding:0;box-shadow:none;position:relative;">
  <!-- Logo banner image as full header background -->
  <div style="width:100%;position:relative;">
    <img src="images/hero-2.jpg" alt="Feel of Goa Family Restaurant" style="width:100%;display:block;max-height:130px;object-fit:cover;object-position:center;" />
    <button class="cart-btn" id="cartBtn" onclick="openCart()" style="position:absolute;top:50%;right:14px;transform:translateY(-50%);display:none;z-index:10;background:rgba(26,140,140,0.9);backdrop-filter:blur(4px);">🛒 <span id="cartLabel">0 items</span></button>
  </div>
</header>

<!-- LOGO BACKGROUND PATCH — marked square area from image 3 -->
<div style="position:relative;overflow:hidden;">
  <!-- Plain cream background for filter/tabs/hero area -->
  <div style="position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,rgba(245,237,216,0.92),rgba(237,227,200,0.88));"></div>
  <!-- Filter bar -->
  <div style="position:relative;z-index:1;border-bottom:1px solid rgba(26,140,140,0.2);padding:8px 12px;display:flex;gap:8px;align-items:center;">
    <button onclick="setVegFilter('all')" id="fAll" style="flex:1;padding:7px;border-radius:20px;border:2px solid rgba(26,140,140,0.7);background:rgba(26,140,140,0.18);color:#1A8C8C;font-weight:700;font-size:11px;font-family:inherit;cursor:pointer">All</button>
    <button onclick="setVegFilter('veg')" id="fVeg" style="flex:1;padding:7px;border-radius:20px;border:1.5px solid rgba(76,175,125,.35);background:rgba(255,255,255,0.5);color:#5C3D1E;font-weight:700;font-size:11px;font-family:inherit;cursor:pointer">🟢 Veg</button>
    <button onclick="setVegFilter('nonveg')" id="fNonveg" style="flex:1;padding:7px;border-radius:20px;border:1.5px solid rgba(217,64,64,.25);background:rgba(255,255,255,0.5);color:#5C3D1E;font-weight:700;font-size:11px;font-family:inherit;cursor:pointer">🔴 Non-Veg</button>
  </div>
  <!-- Tabs -->
  <div class="tabs" id="tabs" style="position:relative;z-index:1;background:transparent;"></div>
  <!-- Category Hero -->
  <div class="category-hero" id="heroWrap" style="position:relative;z-index:1;">
    <img id="heroImg" src="" alt="" />
    <div class="category-hero-info">
      <div>
        <div class="category-hero-emoji" id="heroEmoji"></div>
        <div class="category-hero-name" id="heroName"></div>
        <div class="category-hero-count" id="heroCount"></div>
      </div>
    </div>
  </div>
</div>

<div class="items-grid" id="itemsGrid"></div>
<div class="sticky-footer" id="stickyFooter">
  <button class="sticky-footer-btn" onclick="openCart()">
    View Order — <span id="footerLabel"></span>
  </button>
</div>

<!-- Cart Drawer -->
<div class="cart-drawer" id="cartDrawer" onclick="closeCartOutside(event)">
  <div class="cart-panel">
    <div class="cart-header">
      <div class="cart-title">Your Order</div>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total-row"><span>Total</span><span id="cartTotal">₹0</span></div>
    <div class="cart-footer">
      <label class="field-label">Table Number *</label>
      <input class="field-input" id="tableInput" placeholder="Enter your table number" inputmode="numeric" pattern="[0-9]*" maxlength="3" />
      <label class="field-label">Special Instructions</label>
      <textarea class="field-input" id="noteInput" rows="2" placeholder="Allergies, preferences…" style="resize:none"></textarea>
      <button class="place-btn" id="placeBtn" onclick="placeOrder()" disabled>Place Order →</button>
    </div>
  </div>
</div>

<!-- Success -->
<div id="success-screen">
  <div class="success-icon">✅</div>
  <div class="success-title">Order Placed!</div>
  <div class="success-sub" id="successOrderId"></div>
  <div class="success-note">Your food is being prepared. We'll bring it to your table.</div>
  <button class="order-again-btn" onclick="resetAndOrder()">Order More</button>
</div>

<div class="toast" id="toast"></div>

<script>
const MENU = [
  { category:"Veg Appetizer", emoji:"🌿", veg:true, items:[
    {id:"va1",name:"Schezwan Chutney",price:40,desc:"Spicy schezwan sauce"},
    {id:"va2",name:"Pudina Chutney",price:40,desc:"Fresh mint chutney"},
    {id:"va3",name:"Fry Noodle",price:50,desc:"Crispy fried noodles"},
    {id:"va4",name:"Chakna",price:50,desc:"Chakali, Moong Dal, Peanut"},
    {id:"va5",name:"Roasted Papad",price:30,desc:"Classic roasted papad"},
    {id:"va6",name:"Fry Papad",price:40,desc:"Crispy fried papad"},
    {id:"va7",name:"Masala Papad",price:70,desc:"Papad with masala topping"},
    {id:"va8",name:"Nachni Papad",price:70,desc:"Nachni papad"},
    {id:"va9",name:"Nachni Masala Papad",price:120,desc:"Nachni papad with masala"},
    {id:"va10",name:"Khicha Papad",price:70,desc:"Khicha style papad"},
    {id:"va11",name:"Khicha Masala Papad",price:120,desc:"Khicha papad with masala"},
    {id:"va12",name:"Cheese Cube",price:75,desc:"Golden fried cheese cubes"},
    {id:"va13",name:"Moongdal Chat",price:80,desc:"Moong dal chaat"},
    {id:"va14",name:"Kanda Bhaji",price:100,desc:"Crispy onion fritters"},
    {id:"va15",name:"Green Salad",price:110,desc:"Fresh garden salad"},
    {id:"va16",name:"Chana Boil",price:130,desc:"Boiled spiced chickpeas"},
    {id:"va17",name:"Chana Chatpata",price:160,desc:"Tangy spiced chickpeas"},
    {id:"va18",name:"Chana Garlic",price:180,desc:"Chickpeas with garlic"},

let vegFilter = "all";

function setVegFilter(f) {
  vegFilter = f;
  const styles = {
    all:    { bg:"rgba(232,168,80,.15)",  border:"rgba(232,168,80,.3)",  color:"#E8A850" },
    veg:    { bg:"rgba(76,175,125,.15)",  border:"rgba(76,175,125,.3)",  color:"#4CAF7D" },
    nonveg: { bg:"rgba(217,64,64,.15)",   border:"rgba(217,64,64,.3)",   color:"#D94040" },
  };
  ["all","veg","nonveg"].forEach(k => {
    const btn = document.getElementById("f"+k.charAt(0).toUpperCase()+k.slice(1));
    if(!btn) return;
    const isActive = k === f;
    btn.style.background = isActive ? styles[k].bg : "transparent";
    btn.style.borderColor = isActive ? styles[k].border : "rgba(255,255,255,.1)";
    btn.style.color = isActive ? styles[k].color : "#888";
  });
  buildTabs();
  // Switch to first visible tab
  const visible = getVisibleCategories();
  if(visible.length > 0 && !visible.find(c=>c.category===activeTab)) {
    activeTab = visible[0].category;
  }
  renderItems();
  updateHero();
}

function getVisibleCategories() {
  if(vegFilter === "veg") return MENU.filter(c=>c.veg);
  if(vegFilter === "nonveg") return MENU.filter(c=>!c.veg);
  return MENU;
}

function buildTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  getVisibleCategories().forEach(cat => {
    const b = document.createElement("button");
    b.className = "tab-btn" + (cat.category===activeTab?" active":"");
    b.textContent = cat.emoji+" "+cat.category;
    b.onclick = () => switchTab(cat.category);
    tabs.appendChild(b);
  });
}

function switchTab(cat) {
  activeTab = cat;
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.textContent.includes(MENU.find(c=>c.category===cat)?.category||""));
  });
  renderItems();
  updateHero();
}

function updateHero() {
  const cat = MENU.find(c=>c.category===activeTab);
  const wrap = document.getElementById("heroWrap");
  const img = document.getElementById("heroImg");
  document.getElementById("heroEmoji").textContent = cat.emoji;
  document.getElementById("heroName").textContent = cat.category;
  document.getElementById("heroCount").textContent = cat.items.length+" items";
  wrap.classList.add("visible");
  const url = CAT_IMGS[cat.category];
  if(url){
    img.style.objectPosition = "center center";
    img.src = url;
    img.onload = ()=>img.classList.add("loaded");
  } else { img.src=""; }
}

function renderItems() {
  const grid = document.getElementById("itemsGrid");
  grid.innerHTML = "";
  const cat = MENU.find(c=>c.category===activeTab);
  cat.items.forEach(item => {
    const qty = cart[item.id]||0;
    const isVeg = cat.veg;
    const dotColor = isVeg ? '#4CAF7D' : '#D94040';
    const dotBorder = isVeg ? '#2E7D32' : '#B71C1C';
    const vegDot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${dotColor};border:1.5px solid ${dotBorder};flex-shrink:0;margin-right:5px;margin-top:3px;"></span>`;
    const priceDisplay = item.price === 0
      ? '<span style="color:var(--teal);font-size:12px;font-weight:700">Ask server</span>'
      : `<span class="item-price">${fmt(item.price)}</span>`;
    const imgUrl = ITEM_IMGS[item.id];
    const imgHtml = imgUrl
      ? `<img src="${imgUrl}" alt="${item.name}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=item-img-placeholder>${cat.emoji}</div>'" />`
      : `<div class="item-img-placeholder">${cat.emoji}</div>`;
    const card = document.createElement("div");
    card.className = "item-card"+(qty>0?" in-cart":"");
    card.id = "card-"+item.id;
    card.innerHTML = `
      <div class="item-body">
        <div class="item-img-wrap">${imgHtml}</div>
        <div class="item-details">
          <div>
            <div class="item-name" style="display:flex;align-items:flex-start;">${vegDot}${item.name}</div>
            <div class="item-desc">${item.desc}</div>
          </div>
          <div class="item-bottom">
            ${priceDisplay}
            <div id="ctrl-${item.id}">${renderCtrl(item.id, qty, item.price)}</div>
          </div>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

function renderCtrl(id, qty, price) {
  if(price === 0) return `<span style="font-size:10px;color:var(--muted)">Ask server</span>`;
  if(qty===0) return `<button class="add-btn" onclick="addItem('${id}')">+ Add</button>`;
  return `<div class="qty-ctrl">
    <button class="qty-btn" onclick="remItem('${id}')">−</button>
    <span class="qty-num">${qty}</span>
    <button class="qty-btn" onclick="addItem('${id}')">+</button>
  </div>`;
}

function addItem(id) {
  const current = cart[id] || 0;
  if (current >= 50) return; // sane cap — prevents accidental fat-finger spam
  cart[id] = current + 1;
  refreshItem(id); updateCartUI();
}
function remItem(id) {
  if(!cart[id]) return;
  cart[id]--;
  if(cart[id]===0) delete cart[id];
  refreshItem(id); updateCartUI();
}
function refreshItem(id) {
  const qty = cart[id]||0;
  const it = ALL_ITEMS.find(i=>i.id===id);
  const card = document.getElementById("card-"+id);
  if(card) card.className="item-card"+(qty>0?" in-cart":"");
  const ctrl = document.getElementById("ctrl-"+id);
  if(ctrl) ctrl.innerHTML = renderCtrl(id, qty, it?it.price:1);
}

function updateCartUI() {
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const total = Object.entries(cart).reduce((s,[id,q])=>{const it=ALL_ITEMS.find(i=>i.id===id);return s+(it?it.price*q:0);},0);
  const cartBtn = document.getElementById("cartBtn");
  const footer = document.getElementById("stickyFooter");
  document.getElementById("cartLabel").textContent = `${count} item${count!==1?"s":""} · ${fmt(total)}`;
  document.getElementById("footerLabel").textContent = `${count} items · ${fmt(total)}`;
  document.getElementById("cartTotal").textContent = fmt(total);
  cartBtn.classList.toggle("visible", count>0); cartBtn.style.display = count>0 ? "flex" : "none";
  footer.classList.toggle("visible", count>0);
}

function openCart() {
  renderCartItems();
  document.getElementById("cartDrawer").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeCart() {
  document.getElementById("cartDrawer").classList.remove("open");
  document.body.style.overflow = "";
}
function closeCartOutside(e) { if(e.target===e.currentTarget) closeCart(); }

function renderCartItems() {
  const wrap = document.getElementById("cartItems");
  wrap.innerHTML = "";
  Object.entries(cart).forEach(([id,qty])=>{
    const it = ALL_ITEMS.find(i=>i.id===id);
    if(!it) return;
    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <div class="cart-item-info" style="flex:1">
        <div class="cart-item-name">${it.name}</div>
        <div class="cart-item-unit">${fmt(it.price)} each</div>
      </div>
      <div class="cart-item-right">
        <button class="qty-btn" onclick="remItem('${id}');renderCartItems();updateCartUI()">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" onclick="addItem('${id}');renderCartItems();updateCartUI()">+</button>
        <span class="cart-item-total">${fmt(it.price*qty)}</span>
      </div>`;
    wrap.appendChild(div);
  });
  const ti = document.getElementById("tableInput");
  ti.oninput = () => {
    // Strip anything that isn't a digit
    ti.value = ti.value.replace(/[^0-9]/g, "");
    document.getElementById("placeBtn").disabled = !ti.value.trim();
  };
  document.getElementById("placeBtn").disabled = !ti.value.trim();
}

function placeOrder() {
  const tableInput = document.getElementById("tableInput");
  const table = tableInput.value.trim();
  if(!table) return;

  const cartEntries = Object.entries(cart).filter(([, qty]) => qty > 0);
  if (cartEntries.length === 0) {
    alert("Your cart is empty. Please add at least one item before placing an order.");
    return;
  }

  const note = document.getElementById("noteInput").value.trim();
  const id = (Date.now().toString(36) + Math.random().toString(36).slice(2, 6)).toUpperCase();

  const orderItems = [];
  let total = 0;
  for (const [itemId, qty] of cartEntries) {
    const it = ALL_ITEMS.find(i => i.id === itemId);
    if (!it) continue; // skip any stale/invalid cart entry instead of crashing
    orderItems.push({ id: itemId, name: it.name, qty, price: it.price });
    total += it.price * qty;
  }

  if (orderItems.length === 0) {
    alert("Your cart items are no longer available. Please refresh the menu and try again.");
    return;
  }

  const order = {
    id, table, note,
    items: orderItems,
    total, status:"received", timestamp: Date.now(),
  };

  const placeBtn = document.getElementById("placeBtn");
  placeBtn.disabled = true;
  placeBtn.textContent = "Placing order…";

  let settled = false;

  // Hard timeout — never let the button hang forever, no matter what fails
  const timeoutId = setTimeout(() => {
    if (settled) return;
    settled = true;
    placeBtn.disabled = false;
    placeBtn.textContent = "Place Order →";
    alert("This is taking longer than expected. Please check your internet connection and try again. If the problem continues, please tell a staff member your order directly.");
  }, 12000);

  const doPlace = () => {
    if (window.fbModulesUnsupported) {
      settled = true;
      clearTimeout(timeoutId);
      placeBtn.disabled = false;
      placeBtn.textContent = "Place Order →";
      alert("Your browser is too old to place orders online. Please tell a staff member your order directly.");
      return;
    }
    window.fbAddOrder(order).then(() => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      closeCart();
      cart = {}; updateCartUI();
      MENU.forEach(c=>c.items.forEach(it=>refreshItem(it.id)));
      document.getElementById("successOrderId").textContent = `Table ${table} · Order #${id}`;
      document.getElementById("success-screen").classList.add("show");
      placeBtn.textContent = "Place Order →";
    }).catch((err) => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      const detail = (err && err.code) ? `${err.code}` : (err && err.message) ? err.message : "Unknown error";
      alert("Could not place order.\n\nError detail: " + detail + "\n\nPlease show this to restaurant staff or try again.");
      placeBtn.disabled = false;
      placeBtn.textContent = "Place Order →";
      console.error(err);
    });
  };

  if (window.fbReady) {
    doPlace();
  } else if (window.fbError) {
    settled = true;
    clearTimeout(timeoutId);
    placeBtn.disabled = false;
    placeBtn.textContent = "Place Order →";
    alert("Could not connect to the ordering system. Please tell a staff member your order directly.");
  } else {
    window.addEventListener("firebase-ready", doPlace, { once: true });
    window.addEventListener("firebase-error", () => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      placeBtn.disabled = false;
      placeBtn.textContent = "Place Order →";
      alert("Could not connect to the ordering system. Please tell a staff member your order directly.");
    }, { once: true });
  }
}

function resetAndOrder() {
  document.getElementById("success-screen").classList.remove("show");
  document.getElementById("noteInput").value = "";
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

// ── INIT ─────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const tableParam = params.get("table");
const isValidTable = tableParam && !isNaN(tableParam) && Number(tableParam) > 0 && Number.isInteger(Number(tableParam));

if (!isValidTable) {
  // No valid table number in URL — block access, show "scan QR code" screen only
  document.getElementById("noTableScreen").style.display = "flex";
  document.getElementById("mainPageContent").style.display = "none";
} else {
  // Valid table number — show the real menu
  document.getElementById("noTableScreen").style.display = "none";
  document.getElementById("mainPageContent").style.display = "block";

  const ti = document.getElementById("tableInput");
  ti.value = tableParam;
  ti.readOnly = true;
  ti.style.color = "#E8A850";
  ti.style.borderColor = "rgba(232,168,80,0.4)";

  buildTabs();
  renderItems();
  updateHero();
  updateCartUI();
}

// ── DIAGNOSTIC BADGE LOGIC ──────────────────────────────────────────
function updateDiagBadge() {
  const dot = document.getElementById("diagBadge");
  const panel = document.getElementById("diagPanel");
  if (!dot || !panel) return;

  let color, lines = [];
  lines.push("URL: " + location.href.split("?")[0]);
  lines.push("firebase-config.js loaded: " + (typeof window.fbAddOrder === "function" ? "YES" : "NO"));

  if (window.fbModulesUnsupported) {
    color = "#C0392B";
    lines.push("STATUS: Browser does not support ES modules.");
    lines.push("Firebase can never load in this browser.");
  } else if (window.fbReady) {
    color = "#2E8048";
    lines.push("STATUS: Connected ✓");
  } else if (window.fbError) {
    color = "#C0392B";
    lines.push("STATUS: Connection FAILED");
    lines.push("Error: " + (window.fbError.message || window.fbError));
  } else {
    color = "#C8860A";
    lines.push("STATUS: Connecting…");
  }

  dot.style.background = color;
  panel.innerHTML = lines.map(l => `<div>${l.replace(/</g,"&lt;")}</div>`).join("");
}

updateDiagBadge();
window.addEventListener("firebase-ready", updateDiagBadge);
window.addEventListener("firebase-error", updateDiagBadge);
setTimeout(updateDiagBadge, 3000);
setTimeout(updateDiagBadge, 8000);
setTimeout(updateDiagBadge, 15000);
</script>
