<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firestore Raw Test</title>
</head>
<body style="font-family:monospace;padding:20px;font-size:14px;line-height:1.6;background:#111;color:#eee;">
<h3>Testing a direct read from Firestore — no Firebase SDK, just plain fetch()</h3>
<div id="result">Requesting…</div>

<script>
const url = "https://firestore.googleapis.com/v1/projects/feel-of-goa-restaurant/databases/(default)/documents/orders?key=AIzaSyATcb9J3gAyfHxAPuOy5yTec8ZUM7pbvWg";
const start = Date.now();
const resultEl = document.getElementById("result");

resultEl.textContent = "Requesting… (started " + new Date().toLocaleTimeString() + ")";

fetch(url)
  .then(r => r.json().then(data => ({ status: r.status, data })))
  .then(({ status, data }) => {
    const elapsed = Date.now() - start;
    const docCount = data.documents ? data.documents.length : 0;
    resultEl.innerHTML =
      "<b style='color:#4CAF7D'>✅ SUCCESS in " + elapsed + "ms</b><br>" +
      "HTTP status: " + status + "<br>" +
      "Documents found: " + docCount + "<br><br>" +
      "<pre style='white-space:pre-wrap;font-size:11px;color:#aaa'>" +
      JSON.stringify(data, null, 2).slice(0, 600) + "</pre>";
  })
  .catch(err => {
    const elapsed = Date.now() - start;
    resultEl.innerHTML =
      "<b style='color:#C0392B'>❌ FAILED after " + elapsed + "ms</b><br>" + err.message;
  });

setTimeout(() => {
  if (resultEl.textContent.startsWith("Requesting")) {
    resultEl.innerHTML += "<br><br><b style='color:#E87040'>⚠ Still hanging after 15 seconds — the request itself never completed or failed.</b>";
  }
}, 15000);
</script>
</body>
</html>
