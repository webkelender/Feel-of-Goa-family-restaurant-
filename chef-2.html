<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Feel of Goa Family Restaurant — Chef</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<script type="module" src="firebase-config.js"></script>
<script nomodule>window.fbModulesUnsupported = true;</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F0E8; --card: rgba(253,250,244,.92); --card2: rgba(245,240,230,.88);
    --border: #e0d8cc; --border2: rgba(26,140,140,.1);
    --text: #2C1A0E; --muted: #8A7060; --dim: #6A5848;
    --orange: #D4780A; --green: #2E8048; --red: #C0392B; --blue: #1A8C8C; --amber: #C8860A;
  }
  html { background: #F5F0E8; }
  body { min-height: 100vh; background: transparent; color: var(--text); font-family: system-ui,-apple-system,sans-serif; overscroll-behavior-x: none; touch-action: pan-y; }

  /* BEACH BACKGROUND */
  .beach-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: url('beach-bg.jpg');
    background-size: cover; background-position: center top; background-repeat: no-repeat;
  }
  .beach-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: rgba(245,240,230,0.68);
  }

  /* HEADER */
  header {
    background: rgba(237,232,220,.92); backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(26,140,140,.2);
    padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-sub { font-size: 9px; letter-spacing: .2em; color: var(--amber); text-transform: uppercase; }
  .logo-title { font-size: 17px; font-weight: 800; color: var(--text); }
  .active-count {
    border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 700;
    border: 1px solid transparent; transition: all .3s;
  }
  .active-count.has-orders { background: rgba(212,120,10,.12); border-color: rgba(212,120,10,.35); color: var(--orange); }
  .active-count.no-orders { background: rgba(245,240,230,.6); border-color: rgba(26,140,140,.15); color: var(--muted); }
  .nav-links { display: flex; gap: 8px; }
  .nav-link {
    font-size: 11px; color: var(--muted); text-decoration: none;
    background: rgba(253,250,244,.7); border: 1px solid rgba(26,140,140,.2);
    border-radius: 8px; padding: 5px 12px; transition: color .2s;
  }
  .nav-link:hover { color: #0F6060; }

  /* TICKER */
  .ticker {
    background: rgba(237,232,220,.85); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(26,140,140,.15);
    padding: 7px 24px; display: flex; gap: 24px; overflow-x: auto; flex-shrink: 0;
    position: relative; z-index: 1;
  }
  .ticker::-webkit-scrollbar { display: none; }
  .ticker-item { font-size: 11px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .ticker-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* ORDER GRID */
  .orders-grid {
    padding: 16px 16px 72px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 14px;
    position: relative; z-index: 1;
  }

  /* ORDER CARDS */
  .order-card {
    background: rgba(253,250,244,.92); backdrop-filter: blur(10px);
    border-radius: 14px; border: 2px solid rgba(26,140,140,.2);
    overflow: hidden; transition: border-color .4s, box-shadow .4s; animation: popIn .3s ease;
  }
  @keyframes popIn { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:none} }
  .order-card.urgent { border-color: var(--red) !important; box-shadow: 0 0 20px rgba(192,57,43,.2); }
  .order-card.warning { border-color: var(--orange) !important; }
  .order-card.preparing-state { border-color: rgba(212,120,10,.4); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 14px 10px; }
  .table-num { font-size: 24px; font-weight: 900; color: var(--text); line-height: 1; }
  .order-id-small { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .timer-block { text-align: right; }
  .timer { font-size: 28px; font-weight: 900; line-height: 1; }
  .timer-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .status-chip { margin: 0 14px 10px; display: inline-block; border-radius: 20px; padding: 4px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }

  .card-items { border-top: 1px solid rgba(26,140,140,.1); border-bottom: 1px solid rgba(26,140,140,.1); }
  .card-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 1px solid rgba(26,140,140,.08); }
  .card-item:last-child { border-bottom: none; }
  .card-item-name { font-size: 14px; color: var(--text); }
  .card-item-qty { font-size: 16px; font-weight: 900; color: var(--orange); min-width: 30px; text-align: right; }

  .card-note { margin: 10px 14px 0; background: rgba(212,120,10,.08); border: 1px solid rgba(212,120,10,.25); border-radius: 7px; padding: 7px 10px; font-size: 12px; color: var(--orange); }
  .urgent-banner { margin: 8px 14px 0; background: rgba(192,57,43,.1); border: 1px solid rgba(192,57,43,.35); border-radius: 7px; padding: 6px 10px; font-size: 11px; color: var(--red); font-weight: 700; }

  .card-footer { padding: 12px 14px 14px; }
  .action-btn { width: 100%; border: none; border-radius: 10px; padding: 13px; cursor: pointer; font-weight: 800; font-size: 14px; font-family: inherit; color: #fff; transition: opacity .15s, transform .1s; }
  .action-btn:hover { opacity: .88; }
  .action-btn:active { transform: scale(.98); }
  .action-btn.start  { background: var(--orange); }
  .action-btn.ready  { background: var(--green); }
  .action-btn.served { background: var(--blue); }

  /* EMPTY STATE */
  .empty { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-icon { font-size: 56px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .empty-title { font-size: 18px; font-weight: 700; color: var(--dim); margin-bottom: 6px; }
  .empty-sub { font-size: 12px; }
  .empty-sub a { color: var(--blue); text-decoration: none; }

  /* PING ALERT */
  .ping-alert {
    position: fixed; top: 80px; right: 20px; z-index: 999;
    background: #1A8C8C; color: #fff; border-radius: 12px;
    padding: 12px 20px; font-size: 13px; font-weight: 700;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
    transform: translateX(120%); transition: transform .3s;
  }
  .ping-alert.show { transform: none; }

  /* STATS BAR */
  .stats-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(237,232,220,.92); backdrop-filter: blur(12px);
    border-top: 1px solid rgba(26,140,140,.15);
    padding: 8px 24px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
    z-index: 10;
  }
  .stat-item { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .stat-item span { font-weight: 700; color: var(--text); }

  @media(max-width:500px) {
    .orders-grid { grid-template-columns: 1fr; padding: 10px 10px 72px; }
    header { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="beach-bg"></div>
<div class="beach-overlay"></div>

<!-- DIAGNOSTIC BADGE — tap to see connection status, helps debug without dev tools -->
<div id="diagBadge" onclick="document.getElementById('diagPanel').style.display = document.getElementById('diagPanel').style.display === 'block' ? 'none' : 'block'"
  style="position:fixed;bottom:8px;right:8px;z-index:9999;width:14px;height:14px;border-radius:50%;background:#C8860A;box-shadow:0 0 6px rgba(0,0,0,.4);cursor:pointer;"></div>
<div id="diagPanel" style="display:none;position:fixed;bottom:30px;right:8px;z-index:9999;background:#1a1a1a;color:#eee;font-family:monospace;font-size:11px;padding:12px 14px;border-radius:10px;max-width:260px;box-shadow:0 4px 20px rgba(0,0,0,.5);line-height:1.6;"></div>

<header>
  <div class="header-left">
    <div>
      <div class="logo-sub">Kitchen Display</div>
      <div class="logo-title">👨‍🍳 Chef Station</div>
    </div>
    <div class="active-count no-orders" id="activeCount">0 Active</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:10px;color:var(--muted)" id="refreshLabel">Auto-refresh on</span>
    <div class="nav-links">
      <a href="menu.html" class="nav-link">🛒 Menu</a>
      <a href="admin.html" class="nav-link">📋 Admin</a>
    </div>
  </div>
</header>

<div class="ticker" id="ticker"></div>
<div class="orders-grid" id="ordersGrid"></div>
<div class="stats-bar" id="statsBar"></div>

<div class="ping-alert" id="pingAlert">🔔 New order in the kitchen!</div>

<script>
const fmt = n=>`₹${Number(n).toLocaleString("en-IN")}`;
const elapsedMin = ts=>Math.floor((Date.now()-ts)/60000);

// Escape any user-supplied text before inserting into innerHTML (prevents XSS)
function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

let prevActive = 0;
let tick = 0;

let latestOrders = [];
function getOrders() { return latestOrders; }

let advancingIds = new Set();
function advanceOrder(id, nextStatus) {
  if (advancingIds.has(id)) return; // prevent duplicate rapid taps
  const order = latestOrders.find(o => o.id === id);
  if (!order || !order.docId) return;

  advancingIds.add(id);
  window.fbUpdateOrderStatus(order.docId, nextStatus)
    .catch((err) => {
      console.error(err);
      alert("Could not update order status. Please check your connection and try again.");
    })
    .finally(() => {
      advancingIds.delete(id);
    });
}

// Event delegation for action buttons — reads data-order-id / data-next-status safely,
// avoiding inline onclick="" string interpolation (which is an XSS/injection risk).
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".action-btn[data-order-id]");
  if (!btn) return;
  const id = btn.dataset.orderId;
  const nextStatus = btn.dataset.nextStatus;
  if (id && nextStatus) advanceOrder(id, nextStatus);
});

function render() {
  tick++;
  const allOrders = getOrders();
  const active = allOrders.filter(o=>o.status==="received"||o.status==="preparing"||o.status==="ready");
  const served = allOrders.filter(o=>o.status==="served").length;
  const ready = allOrders.filter(o=>o.status==="ready").length;

  // Active count badge
  const countEl = document.getElementById("activeCount");
  countEl.textContent = active.length+" Active";
  countEl.className = "active-count "+(active.length>0?"has-orders":"no-orders");

  // Ticker
  const ticker = document.getElementById("ticker");
  if(allOrders.length===0) {
    ticker.innerHTML = `<div class="ticker-item"><div class="ticker-dot" style="background:#555"></div><span style="color:#555">No orders yet — waiting for customers</span></div>`;
  } else {
    ticker.innerHTML = allOrders.slice(0,8).map(o=>{
      const colors={received:"#5B9BD5",preparing:"#E87040",ready:"#4CAF7D",served:"#555"};
      return `<div class="ticker-item"><div class="ticker-dot" style="background:${colors[o.status]}"></div><span style="color:#aaa">Table ${esc(o.table)} · ${esc(o.items.map(i=>i.name).join(", "))}</span></div>`;
    }).join("");
  }

  // Stats bar
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-item">🟠 Preparing: <span>${allOrders.filter(o=>o.status==="preparing").length}</span></div>
    <div class="stat-item">🟢 Ready: <span>${ready}</span></div>
    <div class="stat-item">✅ Served today: <span>${served}</span></div>
    <div class="stat-item">📦 Total orders: <span>${allOrders.length}</span></div>
  `;

  // Alert for new active
  if(active.length > prevActive && prevActive >= 0 && tick > 1) pingAlert();
  prevActive = active.length;

  // Render grid
  const grid = document.getElementById("ordersGrid");
  if(active.length===0) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-icon">👨‍🍳</div>
      <div class="empty-title">All caught up!</div>
      <div class="empty-sub">New orders appear here the moment they're placed from the <a href="menu.html" style="color:#E8A850;text-decoration:none">menu page</a>.</div>
    </div>`;
    return;
  }

  // Keep existing cards, update or add new ones
  if(grid.querySelector(".empty")) grid.innerHTML = "";
  const existingIds = new Set([...grid.querySelectorAll(".order-card")].map(c=>c.dataset.id));
  const activeIds = new Set(active.map(o=>o.id));

  // Build lookup map instead of repeated querySelector with interpolated IDs
  const cardById = {};
  grid.querySelectorAll(".order-card").forEach(c => { cardById[c.dataset.id] = c; });

  // Remove cards no longer active
  existingIds.forEach(id=>{ if(!activeIds.has(id) && cardById[id]) { cardById[id].remove(); delete cardById[id]; } });

  active.forEach(order=>{
    const elapsed = elapsedMin(order.timestamp);
    const urgent = elapsed >= 15 && order.status !== "ready";
    const warning = elapsed >= 8 && !urgent && order.status !== "ready";
    const isReady = order.status === "ready";
    const isPreparing = order.status === "preparing";
    const statusColor = isReady?"#4CAF7D":isPreparing?"#E87040":"#5B9BD5";
    const statusBg = isReady?"rgba(76,175,125,.12)":isPreparing?"rgba(232,112,64,.12)":"rgba(91,155,213,.12)";
    const statusLabel = isReady?"Ready for Table":isPreparing?"Preparing":"New Order";
    const timerColor = urgent?"#D94040":warning?"#E87040":"#4CAF7D";

    // data-order-id + data-next-status are read safely via .dataset — never interpolated into JS string context
    let actionBtn;
    if (order.status === "received") {
      actionBtn = `<button class="action-btn start" data-order-id="${esc(order.id)}" data-next-status="preparing">🔥 Start Preparing</button>`;
    } else if (order.status === "preparing") {
      actionBtn = `<button class="action-btn ready" data-order-id="${esc(order.id)}" data-next-status="ready">✅ Mark Ready — Send to Table</button>`;
    } else {
      actionBtn = `<button class="action-btn served" data-order-id="${esc(order.id)}" data-next-status="served">🛎 Mark Served</button>`;
    }

    const html = `
      <div class="card-header">
        <div>
          <div class="table-num">Table ${esc(order.table)}</div>
          <div class="order-id-small">#${esc(order.id)}</div>
        </div>
        <div class="timer-block">
          <div class="timer" style="color:${timerColor}">${elapsed}m</div>
          <div class="timer-label">waiting</div>
        </div>
      </div>
      <div class="status-chip" style="background:${statusBg};color:${statusColor};border:1px solid ${statusColor}40">${statusLabel}</div>
      <div class="card-items">
        ${order.items.map(it=>`
          <div class="card-item">
            <span class="card-item-name">${esc(it.name)}</span>
            <span class="card-item-qty">×${esc(it.qty)}</span>
          </div>`).join("")}
      </div>
      ${order.note?`<div class="card-note">⚠ ${esc(order.note)}</div>`:""}
      ${urgent?`<div class="urgent-banner">🚨 URGENT — Over 15 minutes! Check on this order.</div>`:""}
      <div class="card-footer">${actionBtn}</div>`;

    const existing = cardById[order.id];
    if(existing) {
      existing.className = `order-card${urgent?" urgent":warning?" warning":isPreparing?" preparing-state":""}`;
      existing.innerHTML = html;
    } else {
      const card = document.createElement("div");
      card.className = `order-card${urgent?" urgent":warning?" warning":isPreparing?" preparing-state":""}`;
      card.dataset.id = order.id;
      card.innerHTML = html;
      grid.insertBefore(card, grid.firstChild);
    }
  });
}

function pingAlert() {
  const a = document.getElementById("pingAlert");
  a.classList.add("show");
  setTimeout(()=>a.classList.remove("show"), 3000);
  try { new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAA").play().catch(()=>{}); } catch(e){}
}

// ── LIVE FIRESTORE LISTENER ─────────────────────────────────────────
function setConnStatus(state) {
  const el = document.getElementById("refreshLabel");
  if (!el) return;
  if (state === "live") {
    el.textContent = "🟢 Live";
    el.style.color = "#2E8048";
  } else if (state === "error") {
    el.textContent = "⚠ Offline — orders won't update";
    el.style.color = "#C0392B";
  } else {
    el.textContent = "⏳ Connecting…";
    el.style.color = "#C8860A";
  }
}

let everConnected = false;

function startListening() {
  setConnStatus("connecting");
  window.fbListenOrders((orders, error) => {
    if (error) {
      setConnStatus("error");
      updateDiagPanel({ listenerError: error.message || String(error) });
      return;
    }
    everConnected = true;
    setConnStatus("live");
    latestOrders = orders;
    render();
    updateDiagPanel({});
  });

  // CRITICAL: catches the case where fbReady=true but onSnapshot never calls back
  setTimeout(() => {
    if (!everConnected) {
      setConnStatus("error");
      updateDiagPanel({ stuckConnecting: true });
    }
  }, 10000);
}

if (window.fbReady) {
  startListening();
} else if (window.fbError) {
  setConnStatus("error");
} else {
  setConnStatus("connecting");
  window.addEventListener("firebase-ready", startListening, { once: true });
  window.addEventListener("firebase-error", () => setConnStatus("error"), { once: true });
  setTimeout(() => {
    if (!window.fbReady) {
      setConnStatus("error");
      updateDiagPanel({ scriptNeverLoaded: true });
    }
  }, 12000);
}

// ── DIAGNOSTIC PANEL ─────────────────────────────────────────────
function updateDiagPanel(extra) {
  const dot = document.getElementById("diagBadge");
  const panel = document.getElementById("diagPanel");
  if (!dot || !panel) return;

  let color, lines = [];
  lines.push("URL: " + location.href.split("?")[0]);
  lines.push("firebase-config.js loaded: " + (typeof window.fbAddOrder === "function" ? "YES" : "NO"));
  lines.push("fbReady: " + !!window.fbReady);
  lines.push("everConnected: " + everConnected);

  if (window.fbModulesUnsupported) {
    color = "#C0392B";
    lines.push("STATUS: Browser blocks ES modules entirely.");
  } else if (extra && extra.scriptNeverLoaded) {
    color = "#C0392B";
    lines.push("STATUS: firebase-config.js never loaded.");
    lines.push("Check the file exists at repo root.");
  } else if (extra && extra.stuckConnecting) {
    color = "#C0392B";
    lines.push("STATUS: Connected to Firebase SDK,");
    lines.push("but Firestore realtime connection");
    lines.push("never responded (10s timeout).");
    lines.push("Likely a network/firewall blocking");
    lines.push("WebSocket or long-polling to");
    lines.push("firestore.googleapis.com");
  } else if (extra && extra.listenerError) {
    color = "#C0392B";
    lines.push("STATUS: Firestore error:");
    lines.push(extra.listenerError);
  } else if (window.fbError) {
    color = "#C0392B";
    lines.push("STATUS: Init error: " + (window.fbError.message || window.fbError));
  } else if (everConnected) {
    color = "#2E8048";
    lines.push("STATUS: Connected ✓ (" + latestOrders.length + " orders)");
  } else {
    color = "#C8860A";
    lines.push("STATUS: Connecting…");
  }

  dot.style.background = color;
  panel.innerHTML = lines.map(l => `<div>${String(l).replace(/</g,"&lt;")}</div>`).join("");
}

updateDiagPanel({});
setTimeout(() => updateDiagPanel({}), 3000);

// Also refresh elapsed-time labels every 30s even without new data
setInterval(() => render(), 30000);
</script>
</body>
</html>
